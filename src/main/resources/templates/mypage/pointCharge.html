<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도토리 창고 - 포인트 충전</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="/css/pointCharge.css">
</head>
<body>

<!-- 글로벌 내비게이션 바 (헤더) -->
<header class="top-nav">
    <div class="nav-content">
        <h1 id="logo">🌰 도토리 창고</h1>
        <nav>
            <ul id="gnb-list">
                <li><a href="/group-buyings" id="link-home">홈</a></li>
                <li><a href="/chat/rooms" id="link-chat">채팅방</a></li>
                <li><a href="/mypage" id="link-mypage">마이</a></li>
            </ul>
        </nav>
    </div>
</header>

<!-- 메인 콘텐츠 영역 -->
<main class="container">
    <div class="page-header">
        <h2 class="page-title">
            <span class="back-arrow" id="btn-back-arrow">←</span>
            포인트 충전
        </h2>
    </div>

    <!-- 포인트 충전 카드 섹션 -->
    <section class="charge-card">
        <div class="charge-header">
            <h3>얼마를 충전할까요?</h3>
            <p>충전할 도토리 포인트를 입력해주세요. (임시 결제 화면)</p>
        </div>

        <div class="input-wrap">
            <input type="number" id="pointInput" placeholder="10000" step="1000" min="1000">
            <span class="currency">P</span>
        </div>
        <p class="input-hint">* 최소 1,000P부터 충전 가능합니다.</p>

        <div class="button-group">
            <button type="button" id="btn-cancel" class="btn btn-secondary">취소</button>
            <button type="button" id="btn-charge" class="btn btn-primary">결제 및 충전하기</button>
        </div>
    </section>
</main>

<script th:inline="javascript">
    const API_POINT_CHARGE_URL = `/api/members/me/point/kakao/ready`;
    const API_KAKAO_APPROVE_URL = '/api/members/me/point/kakao/approve';
    const MYPAGE_URL = '/mypage';

    window.onload = function() {
        // 뒤로가기 화살표 이벤트 연결
        document.getElementById('btn-back-arrow').addEventListener('click', function() {
            goBack();
        });

        // 충전하기 버튼 이벤트 연결
        document.getElementById('btn-charge').addEventListener('click', function() {
            requestCharge();
        });

        // 취소 버튼 이벤트 연결
        document.getElementById('btn-cancel').addEventListener('click', function() {
            goBack();
        });
    };

    function handleKakaoApprove(pgToken) {
        fetch(API_KAKAO_APPROVE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pgToken: pgToken })
        })
            .then(res => res.json())
            .then(data => {
                if (data.status === 200) {
                    alert("포인트 충전이 완료되었습니다!");
                    location.href = '/mypage';
                } else {
                    alert("결제 승인 중 오류가 발생했습니다.");
                    location.href = '/mypage/charge?error=true';
                }
            })
            .catch(() => {
                alert("네트워크 오류가 발생했습니다.");
                location.href = '/mypage/charge?error=true';
            });
    }

    // 포인트 충전 API 요청 함수
    function requestCharge() {
        const pointValue = document.getElementById("pointInput").value;

        // 입력값 검증
        if (!pointValue || pointValue < 1000) {
            alert("최소 1,000P 이상 올바른 금액을 입력해주세요.");
            return;
        }

        // 실제 PG사 연동 전이므로 사용자에게 확인만 받음
        if (!confirm(`정말 ${Number(pointValue).toLocaleString()}P를 충전하시겠습니까?`)) {
            return;
        }

        // API 엔드포인트 및 방식
        const apiUrl = API_POINT_CHARGE_URL;
        const requestOptions = {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                point: Number(pointValue)
            })
        };

        fetch(apiUrl, requestOptions)
            .then(response => {
                return response.json();
            })
            .then(data => {
                if (data.data && data.data.redirectUrl) {
                    window.open(
                        data.data.redirectUrl,
                        'kakaopay',
                        'width=500,height=600,scrollbars=yes'
                    );
                } else {
                    alert("결제 준비 중 오류가 발생했습니다.");
                }
            })
            .catch(error => {
                console.error("카카오페이 오류:", error);
                alert("결제 요청 실패: " + error.message);
            });
    }

    // 이전 페이지로 돌아가는 로직
    function goBack() {
        if (document.referrer) {
            location.href = document.referrer;
        } else {
            location.href = MYPAGE_URL;
        }
    }
</script>

</body>
</html>
