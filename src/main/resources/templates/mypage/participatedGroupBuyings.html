<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도토리 창고 - 참여한 공구 이력</title>
    <link rel="stylesheet" href="/css/participatedGroupBuyings.css">
</head>
<body>

<header class="top-nav">
    <div class="nav-content">
        <h1>🌰 도토리 창고</h1>
        <a href="/mypage" class="back-btn">마이페이지로 돌아가기</a>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <h2 class="page-title">
            <span class="back-arrow" onclick="location.href='/mypage'">←</span>
            참여한 공구 이력
        </h2>

        <section class="status-filters">
            <button type="button" class="status-btn active" onclick="changeStatus('RECRUITING', this)">모집 중</button>
            <button type="button" class="status-btn" onclick="changeStatus('START', this)">공구 시작</button>
            <button type="button" class="status-btn" onclick="changeStatus('PURCHASED', this)">구매 완료</button>
            <button type="button" class="status-btn" onclick="changeStatus('SHIPPING', this)">배송 중</button>
            <button type="button" class="status-btn" onclick="changeStatus('MEETING_SCHEDULED', this)">만남 예정</button>
            <button type="button" class="status-btn" onclick="changeStatus('SETTLING', this)">정산 진행</button>
            <button type="button" class="status-btn" onclick="changeStatus('CLOSED', this)">공구 종료</button>
        </section>
    </div>

    <section id="participation-list">
    </section>
</main>

<script>
    let currentStatus = 'RECRUITING';
    const PARTICIPATED_GROUP_BUYINGS_URL = "/api/members/me/participations"; // 추가: 내가 참여한 공구 목록 요청 URL 상수화
    const LOGIN_PAGE_URL = "/auth/login"; // 추가: 로그인 화면 이동 URL 상수화

    // 피그마 시안에 맞춘 상태 텍스트 및 컬러 테마 매핑
    const statusConfig = {
        'RECRUITING': { text: '모집 중', theme: 'mint' },
        'START': { text: '수락대기', theme: 'orange' }, // 피그마 시안의 '수락대기' 느낌 적용
        'PURCHASED': { text: '확인 완료', theme: 'mint' }, // 피그마 시안의 '확인 완료' 느낌 적용
        'SHIPPING': { text: '배송중', theme: 'blue' },
        'MEETING_SCHEDULED': { text: '만남 예정', theme: 'orange' },
        'SETTLING': { text: '정산 중', theme: 'yellow' },
        'CLOSED': { text: '종료', theme: 'gray' }
    };

    window.onload = function() {
        requestParticipatedGroupBuyings(currentStatus);
    };

    function formatDateTime(dateTime) {
    if (!dateTime) {
        return '일시 미정';
    }

    const date = new Date(dateTime);

    if (Number.isNaN(date.getTime())) {
        return '일시 미정';
    }

    const month = date.getMonth() + 1;
    const day = date.getDate();
    const hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const period = hours < 12 ? '오전' : '오후';
    const displayHours = hours % 12 === 0 ? 12 : hours % 12;

    return `${month}월 ${day}일 ${period} ${displayHours}:${minutes}`;
}

    function changeStatus(status, element) {
        currentStatus = status;

        // 버튼 활성화 스타일 변경
        document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
        if (element) element.classList.add('active');

        requestParticipatedGroupBuyings(currentStatus);
    }

    function requestParticipatedGroupBuyings(status) {
        fetch(`${PARTICIPATED_GROUP_BUYINGS_URL}?status=${encodeURIComponent(status)}`) // 수정: URL 상수 사용
            .then(response => response.json())
            .then(data => {
                if (data.status === 401) {
                    alert(data.message);
                    location.href = LOGIN_PAGE_URL; // 수정: 로그인 이동 URL 상수 사용
                    return;
                }

                if (data.status === 400) {
                    alert(data.message);
                    return;
                }

                if (data.status !== 200) {
                    alert(data.message || '참여한 공구 이력 목록을 불러오지 못했습니다.');
                    return;
                }

                renderParticipatedGroupBuyings(data.data || []);
            })
            .catch(error => {
                console.error('참여한 공구 이력 목록 조회 실패:', error);
                alert('참여한 공구 이력 목록을 불러오지 못했습니다.');
            });
    }

    function renderParticipatedGroupBuyings(items) {
        const list = document.getElementById('participation-list');
        list.innerHTML = '';

        if (items.length === 0) {
            list.innerHTML = '<div class="empty-state"><p>조회된 참여 이력이 없습니다.</p></div>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('article');
            card.className = 'gb-card';

            card.onclick = () => {
                location.href = `/mypage/gb-detail/${item.participationId}`;
            };

            // 데이터 포맷팅
            const price = (item.totalPrice || 0).toLocaleString();
            const point = (item.paidPoint || 0).toLocaleString();
            const badge = statusConfig[item.groupBuyingStatus] || { text: item.groupBuyingStatus, theme: 'gray' };
            const deadlineText = formatDateTime(item.deadline);
            const meetingAtText = formatDateTime(item.meetingAt);
            const meetPlace = item.meetingPlace || '미정';

            card.innerHTML = `
                <div class="card-header">
                    <span class="status-badge theme-${badge.theme}">${badge.text}</span>
                </div>
                <h3 class="title">${item.title}</h3>
                <p class="deadline">마감 ${deadlineText}</p>

                <div class="meeting-info">
                   📍 만남: ${meetingAtText} · ${meetPlace}
                </div>

                <div class="info-row">
                    <span class="price">${price}원</span>
                    <span class="divider">|</span>
                    <span class="quantity">신청 ${item.applyQuantity}개</span>
                    <span class="divider">|</span>
                    <span class="point">결제 <strong>${point}P</strong></span>
                </div>
            `;
            list.appendChild(card);
        });
    }
</script>
</body>
</html>
