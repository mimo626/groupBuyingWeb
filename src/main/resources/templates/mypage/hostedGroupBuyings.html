<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도토리 창고 - 내가 개설한 공구</title>
</head>
<body>
<header>
    <h1>🌰 도토리 창고</h1>
    <a href="/auth/mypage">마이페이지로 돌아가기</a>
</header>

<main>
    <h2>내가 개설한 공구</h2>

    <section>
        <button type="button" onclick="changeStatus('RECRUITING')">모집 중</button>
        <button type="button" onclick="changeStatus('START')">공구 시작</button>
        <button type="button" onclick="changeStatus('PURCHASED')">물품 구매 완료</button>
        <button type="button" onclick="changeStatus('SHIPPING')">배송 중</button>
        <button type="button" onclick="changeStatus('MEETING_SCHEDULED')">만남 날짜 입력 완료</button>
        <button type="button" onclick="changeStatus('SETTLING')">정산 진행 중</button>
        <button type="button" onclick="changeStatus('CLOSED')">공구 종료</button>
    </section>

    <section id="group-buying-list">
        <!-- JS에서 목록을 렌더링한다. -->
    </section>
</main>

<script>
    let currentStatus = 'RECRUITING';

    window.onload = function() {
        requestHostedGroupBuyings(currentStatus);
    };

    function changeStatus(status) {
        currentStatus = status;
        requestHostedGroupBuyings(currentStatus);
    }

    function requestHostedGroupBuyings(status) {
        fetch('/api/mypage/group-buys?status=' + encodeURIComponent(status))
            .then(response => response.json())
            .then(data => {
                if (data.status === 400 || data.status === 401) {
                    alert(data.message);
                    location.href = '/loginTest.html';
                    return;
                }

                renderHostedGroupBuyings(data.data || []);
            })
            .catch(error => {
                console.error('내가 개설한 공구 목록 조회 실패:', error);
                alert('내가 개설한 공구 목록을 불러오지 못했습니다.');
            });
    }

    function renderHostedGroupBuyings(items) {
        const list = document.getElementById('group-buying-list');
        list.innerHTML = '';

        if (items.length === 0) {
            list.innerHTML = '<p>조회된 공구가 없습니다.</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('article');
            card.onclick = () => {
                location.href = `/mypage/gb-detail/${item.participationId}`;
            };
            card.innerHTML = `
                <h3>${item.title}</h3>
                <p>가격: ${item.totalPrice}</p>
                <p>목표 수량: ${item.targetQuantity}</p>
                <p>현재 참여 수량: ${item.currentQuantity}</p>
                <p>상태: ${item.status}</p>
                <p>마감일: ${item.deadline}</p>
            `;
            list.appendChild(card);
        });
    }
</script>
</body>
</html>
