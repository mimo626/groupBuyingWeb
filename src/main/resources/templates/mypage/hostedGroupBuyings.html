<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도토리 창고 - 내가 개설한 공구</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="/css/hostedGroupBuyings.css">
</head>
<body>

<!-- 상단 네비게이션바 (기존 마이페이지와 통일감 부여) -->
<header class="top-nav">
    <div class="nav-content">
        <h1>🌰 도토리 창고</h1>
        <a href="/mypage" class="back-btn">마이페이지로 돌아가기</a>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <h2 class="page-title">
            <span class="back-arrow" onclick="location.href='/mypage'">←</span>
            내가 개설한 공구
        </h2>

        <!-- 상태별 필터 버튼 우측 상단 배치 -->
        <section class="status-filters">
            <button type="button" class="status-btn active" onclick="changeStatus('RECRUITING', this)">모집 중</button>
            <button type="button" class="status-btn" onclick="changeStatus('START', this)">공구 시작</button>
            <button type="button" class="status-btn" onclick="changeStatus('PURCHASED', this)">물품 구매 완료</button>
            <button type="button" class="status-btn" onclick="changeStatus('SHIPPING', this)">배송 중</button>
            <button type="button" class="status-btn" onclick="changeStatus('MEETING_SCHEDULED', this)">만남 날짜 완료</button>
            <button type="button" class="status-btn" onclick="changeStatus('SETTLING', this)">정산 진행 중</button>
            <button type="button" class="status-btn" onclick="changeStatus('CLOSED', this)">공구 종료</button>
        </section>
    </div>

    <section id="group-buying-list">
        <!-- JS에서 목록을 렌더링한다. -->
    </section>
</main>

<script>
    let currentStatus = 'RECRUITING';
    const HOSTED_GROUP_BUYINGS_URL = "/api/members/me/group-buyings"; // 추가: 내가 개설한 공구 목록 요청 URL 상수화
    const LOGIN_PAGE_URL = "/auth/login"; // 추가: 로그인 화면 이동 URL 상수화

    // 상태값을 한글로 매핑해주는 객체
    const statusMap = {
        'RECRUITING': '모집중',
        'START': '공구시작',
        'PURCHASED': '구매완료',
        'SHIPPING': '배송중',
        'MEETING_SCHEDULED': '만남예정',
        'SETTLING': '정산중',
        'CLOSED': '종료'
    };

    window.onload = function() {
        requestHostedGroupBuyings(currentStatus);
    };

    function changeStatus(status, element) {
        currentStatus = status;

        // 버튼 활성화 스타일 변경
        document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
        if (element) element.classList.add('active');

        requestHostedGroupBuyings(currentStatus);
    }

    function requestHostedGroupBuyings(status) {
        fetch(`${HOSTED_GROUP_BUYINGS_URL}?status=${encodeURIComponent(status)}`) // 수정: URL 상수 사용
            .then(response => response.json())
            .then(data => {
                if (data.status === 401) {
                    alert(data.message);
                    location.href = LOGIN_PAGE_URL; // 수정: 로그인 이동 URL 상수 사용
                    return;
                }

                if (data.status === 400) {
                    alert(data.message);
                    return;
                }

                if (data.status !== 200) {
                    alert(data.message || '내가 개설한 공구 목록을 불러오지 못했습니다.');
                    return;
                }

                renderHostedGroupBuyings(data.data || []);
            })
            .catch(error => {
                console.error('내가 개설한 공구 목록 조회 실패:', error);
                alert('내가 개설한 공구 목록을 불러오지 못했습니다.');
            });
    }

    function renderHostedGroupBuyings(items) {
        const list = document.getElementById('group-buying-list');
        list.innerHTML = '';

        if (items.length === 0) {
            list.innerHTML = '<div class="empty-state"><p>조회된 공구가 없습니다.</p></div>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('article');
            card.className = 'gb-card';

            // 기존 스크립트 밖으로 빠져있던 이벤트 리스너 오류 수정
            card.onclick = () => {
                console.log('상세페이지 이동에 사용할 participationId:', item.participationId);
                console.log('상세페이지 이동에 사용할 groupBuyingId:', item.groupBuyingId);
                location.href = `/mypage/gb-detail/${item.participationId}`;
            };

            // 목표 대비 현재 수량 퍼센트 계산
            const targetQty = item.targetQuantity || 1;
            const currentQty = item.currentQuantity || 0;
            const percentage = Math.min(Math.round((currentQty / targetQty) * 100), 100);

            // 가격 콤마 포맷팅
            const priceFormatted = (item.totalPrice || 0).toLocaleString();

            card.innerHTML = `
                <div class="card-header">
                    <span class="status-badge">${statusMap[item.status] || item.status}</span>
                    <span class="arrow-icon">&gt;</span>
                </div>
                <h3 class="title">${item.title}</h3>
                <p class="deadline">마감 ${item.deadline}</p>

                <div class="info-row">
                    <span class="price">${priceFormatted}원</span>
                    <span class="divider">|</span>
                    <span class="target">모집 ${targetQty}개</span>
                    <span class="divider">|</span>
                    <span class="current">현재 ${currentQty}개</span>
                </div>

                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percentage}%"></div>
                    </div>
                    <span class="progress-text">${currentQty}/${targetQty} (${percentage}%)</span>
                </div>
            `;
            list.appendChild(card);
        });
    }
</script>
</body>
</html>
