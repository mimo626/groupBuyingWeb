<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도토리 창고</title>
    <style>
        /* 기본 리셋 및 폰트 */
        body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; background-color: #fcfcfc; color: #333; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; padding: 0; margin: 0; }

        /* 헤더 (상단 네비게이션) */
        .header { background-color: #a0522d; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header-logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .header-nav { display: flex; gap: 30px; font-size: 16px; font-weight: 500; }
        .header-nav span { cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* 메인 컨테이너 */
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

        /* 검색 바 */
        .search-container { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 15px 20px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background-color: #fff; }

        /* 카테고리 필터 */
        .category-list { display: flex; gap: 10px; margin-bottom: 40px; overflow-x: auto; padding-bottom: 10px; }
        .category-btn { padding: 10px 20px; border: 1px solid #eee; border-radius: 20px; background-color: #fff; color: #666; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .category-btn.active { background-color: #a0522d; color: white; border-color: #a0522d; }

        /* 섹션 헤더 (모집중인 공구, 정렬, 공구개설) */
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .section-title h2 { margin: 0 0 5px 0; font-size: 22px; color: #111; }
        .section-title .count { font-size: 14px; color: #888; }
        .section-title .count strong { color: #a0522d; }

        /* 우측 컨트롤 (정렬 + 개설버튼) */
        .controls { display: flex; gap: 10px; align-items: center; }
        .sort-select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
        .create-btn { padding: 10px 20px; font-size: 15px; font-weight: bold; color: white; background-color: #b05a3b; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; }
        .create-btn:hover { background-color: #8c452b; }

        /* 카드 그리드 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 24px; }
        .card { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; overflow: hidden; display: block; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }

        /* 썸네일 및 뱃지 */
        .thumbnail-wrapper { position: relative; width: 100%; height: 200px; background-color: #f8f9fa; }
        .thumbnail { width: 100%; height: 100%; object-fit: cover; }
        .badge-status { position: absolute; top: 12px; left: 12px; background-color: #20c997; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-dday { position: absolute; top: 12px; right: 12px; background-color: rgba(0,0,0,0.5); color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* 카드 내용 */
        .card-content { padding: 20px; }
        .title { font-size: 18px; font-weight: bold; margin: 0 0 6px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .desc { font-size: 14px; color: #666; margin-bottom: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .price-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .price { font-size: 20px; font-weight: bold; color: #b05a3b; }
        .location { font-size: 13px; color: #888; }

        .meta-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; border-top: 1px solid #f0f0f0; padding-top: 12px; }
        .participants strong { color: #b05a3b; }

        /* 페이징 */
        .pagination { display: flex; justify-content: center; margin-top: 40px; gap: 8px; }
        .pagination a, .pagination span { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: #fff; }
        .pagination span.active { background-color: #a0522d; color: white; border-color: #a0522d; }
        .pagination a:hover { background-color: #f5f5f5; }
        .pagination a.disabled { color: #ccc; pointer-events: none; background-color: #fafafa; }
    </style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="header">
    <div class="header-logo">
        🌰 도토리 창고
    </div>
    <div class="header-nav">
        <!-- JS로 라우팅 처리하기 위해 id 부여 -->
        <span id="homeBtn">🏠 홈</span>
        <span id="chattingBtn">💬 채팅방</span>
        <span id="myPageBtn">👤 마이</span>
    </div>
</header>

<div class="container">

    <!-- 검색 폼 (서버로 파라미터 전송용) -->
    <form id="searchForm" th:action="@{/group-buying/list}" method="get">

        <!-- 1. 검색 바 -->
        <div class="search-container">
            <!-- 검색어 유지되도록 value 세팅 -->
            <input type="text" name="keyword" class="search-input" placeholder="🔍 공구 검색하기" th:value="${param.keyword}">
        </div>

        <!-- 2. 카테고리 필터 -->
        <div class="category-list">
            <!-- '전체' 카테고리 (기본값) -->
            <!-- #strings.isEmpty()를 사용하면 null과 빈 문자열('')을 한 번에 안전하게 체크할 수 있습니다. -->
            <button type="button"
                    class="category-btn"
                    th:classappend="${#strings.isEmpty(selectedCategory)} ? 'active' : ''"
                    onclick="setCategory('')">전체</button>

            <!-- Java Enum 카테고리 반복 -->
            <th:block th:each="c : ${category}">
                <button type="button"
                        class="category-btn"
                        th:classappend="${#strings.equals(selectedCategory, c.name)} ? 'active'"
                        th:data-category="${c.name}"
                        onclick="setCategory(this.getAttribute('data-category'))"
                        th:text="${c.description}"></button>
            </th:block>

            <!-- 숨겨진 input으로 카테고리 값 전송 (param 대신 모델의 selectedCategory 사용) -->
            <input type="hidden" id="categoryInput" name="category" th:value="${selectedCategory}">
        </div>

        <!-- 3. 섹션 헤더 (타이틀, 정렬, 공구 개설) -->
        <div class="section-header">
            <div class="section-title">
                <h2>모집 중인 공구</h2>
                <div class="count"><strong th:text="${groupBuyings.totalElements}">9</strong>개의 공구를 찾았습니다</div>
            </div>

            <div class="controls">
                <!-- 정렬 드롭다운 (변경 시 폼 자동 서브밋) -->
                <select name="sort" class="sort-select" onchange="document.getElementById('searchForm').submit();">
                    <th:block th:each="sortType : ${sorts}">
                        <option th:value="${sortType.sortValue}"
                                th:text="${sortType.description}"
                                th:selected="${(param.sort == null and sortType.name() == 'LATEST') or (param.sort != null and param.sort[0] == sortType.sortValue)}">
                        </option>
                    </th:block>
                </select>

                <!-- 공구 개설 버튼 (form 바깥 로직이므로 type="button") -->
                <button type="button" id="createGroupBtn" class="create-btn">+ 공구 개설</button>
            </div>
        </div>

    </form>

    <!-- 공구 목록 그리드 -->
    <div class="grid">
        <a th:each="item : ${groupBuyings.content}" th:href="@{/group-buying/{id}(id=${item.id})}" class="card">
            <!-- 썸네일 영역 -->
            <div class="thumbnail-wrapper">
                <span class="badge-status" th:text="${item.status.description}">모집중</span>
                <span class="badge-dday" th:text="${item.dDayString}"></span>
                <img class="thumbnail" th:src="${item.thumbnailImage != null ? item.thumbnailImage : '/images/default-thumb.jpg'}" alt="공구 썸네일">
            </div>

            <!-- 텍스트 영역 -->
            <div class="card-content">
                <h3 class="title" th:text="${item.title}">유아 신발 공구</h3>
                <div class="desc" th:text="${item.productName}">나이키 키즈 운동화 · 160~220mm 사이즈</div>

                <div class="price-row">
                    <div class="price" th:text="${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')} + '원'">59,000원</div>
                    <div class="location" th:text="${item.neighborhoodName}">을지로동</div>
                </div>

                <div class="meta-row">
                    <div class="participants">
                        <strong th:text="${item.currentQuantity}">3</strong> / <span th:text="${item.targetQuantity} + '개'">8개</span>
                    </div>
                    <div class="views" th:text="'👁 ' + ${item.viewCount}">👁 198</div>
                </div>
            </div>
        </a>
    </div>

    <!-- 페이징 처리 -->
    <div class="pagination" th:if="${groupBuyings.totalPages > 0}">
        <!-- 파라미터 유지를 위해 th:href에 queryString 적용 -->
        <a th:href="@{/list(page=${groupBuyings.number - 1}, category=${param.category}, keyword=${param.keyword}, sort=${param.sort})}"
           th:classappend="${groupBuyings.first} ? 'disabled' : ''">‹</a>

        <span class="active" th:text="${groupBuyings.number + 1}">1</span>

        <a th:href="@{/list(page=${groupBuyings.number + 1}, category=${param.category}, keyword=${param.keyword}, sort=${param.sort})}"
           th:classappend="${groupBuyings.last} ? 'disabled' : ''">›</a>
    </div>

</div>

<script>
    // 카테고리 클릭 시 폼 제출 처리 함수
    function setCategory(categoryVal) {
        document.getElementById('categoryInput').value = categoryVal;
        document.getElementById('searchForm').submit();
    }

    // 버튼 라우팅 로직
    const homeBtn = document.getElementById("homeBtn");
    const createGroupBtn = document.getElementById("createGroupBtn");
    const chattingBtn = document.getElementById("chattingBtn");
    const myPageBtn = document.getElementById("myPageBtn");

    homeBtn.addEventListener("click", () => {
        window.location.href = "/group-buying/list";
    });

    createGroupBtn.addEventListener("click", () => {
        window.location.href = "/group-buying/create";
    });

    chattingBtn.addEventListener("click", () => {
        window.location.href = "/chat/rooms-test";
    });

    myPageBtn.addEventListener("click", () => {
        window.location.href = "/mypage";
    });
</script>

</body>
</html>
