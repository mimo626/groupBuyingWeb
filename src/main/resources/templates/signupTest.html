<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입 테스트</title>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
<h1>회원가입 테스트</h1>

<h2>아이디 중복확인</h2>
<input type="text" id="loginId" placeholder="로그인 아이디">
<button type="button" onclick="checkLoginId()">아이디 중복확인</button>
<p id="loginIdResult"></p>

<h2>닉네임 중복확인</h2>
<input type="text" id="nickname" placeholder="닉네임">
<button type="button" onclick="checkNickname()">닉네임 중복확인</button>
<p id="nicknameResult"></p>

<h2>비밀번호</h2>
<input type="password" id="password" placeholder="비밀번호" oninput="checkPasswordMatch()">
<input type="password" id="passwordConfirm" placeholder="비밀번호 확인" oninput="checkPasswordMatch()">
<p id="passwordMatchResult"></p>

<h2>주소 선택</h2>
<button type="button" onclick="openAddressPopup()">주소 선택</button>

<p>선택 주소: <input type="text" id="address" readonly></p>
<p>경도 entX: <input type="text" id="entX" readonly></p>
<p>위도 entY: <input type="text" id="entY" readonly></p>

<h2>약관 동의</h2>
<label>
  <input type="checkbox" id="termsAgreed">
  필수 약관 동의
</label>

<h2>회원가입</h2>
<button type="button" onclick="signup()">회원가입 요청</button>

<h2>결과</h2>
<pre id="result"></pre>

<script th:inline="javascript">
  const kakaoJavaScriptKey = /*[[${kakaoJavaScriptKey}]]*/ "";
  let addressGeocoder = null;
  let kakaoSdkReadyPromise = null;

  function renderResult(data) {
      document.getElementById("result").innerText = JSON.stringify(data, null, 2);
  }

  function loadKakaoMapSdk() {
      if (kakaoSdkReadyPromise) {
          return kakaoSdkReadyPromise;
      }

      kakaoSdkReadyPromise = new Promise(function(resolve, reject) {
          if (!kakaoJavaScriptKey) {
              reject(new Error("카카오 JavaScript 키가 비어 있습니다."));
              return;
          }

          if (window.kakao && window.kakao.maps && window.kakao.maps.services) {
              addressGeocoder = new kakao.maps.services.Geocoder();
              resolve(addressGeocoder);
              return;
          }

          const script = document.createElement("script");
          script.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey="
                  + encodeURIComponent(kakaoJavaScriptKey)
                  + "&libraries=services&autoload=false";

          script.onload = function() {
              if (!window.kakao || !kakao.maps) {
                  reject(new Error("카카오 지도 SDK가 정상적으로 로드되지 않았습니다."));
                  return;
              }

              kakao.maps.load(function() {
                  if (!kakao.maps.services) {
                      reject(new Error("카카오 services 라이브러리가 로드되지 않았습니다."));
                      return;
                  }

                  addressGeocoder = new kakao.maps.services.Geocoder();
                  console.log("카카오 지도 SDK 로드 완료");
                  resolve(addressGeocoder);
              });
          };

          script.onerror = function() {
              reject(new Error("카카오 지도 SDK 스크립트 로드에 실패했습니다."));
          };

          document.head.appendChild(script);
      });

      return kakaoSdkReadyPromise;
  }

  window.addEventListener("load", function() {
      loadKakaoMapSdk().catch(function(error) {
          console.error(error);
          alert(error.message);
      });
  });

  function checkPasswordMatch() {
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;
      const result = document.getElementById("passwordMatchResult");

      if (!password && !passwordConfirm) {
          result.innerText = "";
          return false;
      }

      if (!passwordConfirm) {
          result.innerText = "비밀번호 확인값을 입력해주세요.";
          return false;
      }

      if (password === passwordConfirm) {
          result.innerText = "비밀번호가 일치합니다.";
          return true;
      }

      result.innerText = "비밀번호가 일치하지 않습니다.";
      return false;
  }

  async function checkLoginId() {
      const loginId = document.getElementById("loginId").value;

      const response = await fetch(`/auth/login-id/check?loginId=${encodeURIComponent(loginId)}`);
      const data = await response.json();

      renderResult(data);

      if (data.status !== 200 || !data.data) {
          document.getElementById("loginIdResult").innerText = data.message;
          return;
      }

      document.getElementById("loginIdResult").innerText =
              data.data.available ? "사용 가능한 아이디입니다." : "이미 사용 중인 아이디입니다.";
  }

  async function checkNickname() {
      const nickname = document.getElementById("nickname").value;

      const response = await fetch(`/auth/nickname/check?nickname=${encodeURIComponent(nickname)}`);
      const data = await response.json();

      renderResult(data);

      if (data.status !== 200 || !data.data) {
          document.getElementById("nicknameResult").innerText = data.message;
          return;
      }

      document.getElementById("nicknameResult").innerText =
              data.data.available ? "사용 가능한 닉네임입니다." : "이미 사용 중인 닉네임입니다.";
  }

  function openAddressPopup() {
      if (!window.daum || !daum.Postcode) {
          alert("다음 우편번호 서비스가 정상적으로 로드되지 않았습니다.");
          return;
      }

      new daum.Postcode({
          oncomplete: async function(data) {
              const selectedAddress = data.roadAddress || data.jibunAddress || data.address;

              if (!selectedAddress) {
                  alert("선택된 주소가 없습니다.");
                  return;
              }

              document.getElementById("address").value = selectedAddress;
              document.getElementById("entX").value = "";
              document.getElementById("entY").value = "";

              try {
                  const geocoder = await loadKakaoMapSdk();

                  geocoder.addressSearch(selectedAddress, function(result, status) {
                      if (status !== kakao.maps.services.Status.OK || result.length === 0) {
                          alert("선택한 주소의 좌표를 찾을 수 없습니다.");
                          document.getElementById("entX").value = "";
                          document.getElementById("entY").value = "";
                          return;
                      }

                      document.getElementById("entX").value = result[0].x;
                      document.getElementById("entY").value = result[0].y;
                  });
              } catch (error) {
                  console.error(error);
                  alert(error.message);
                  document.getElementById("entX").value = "";
                  document.getElementById("entY").value = "";
              }
          }
      }).open();
  }

  async function signup() {
      const address = document.getElementById("address").value;
      const entX = document.getElementById("entX").value;
      const entY = document.getElementById("entY").value;

      if (!address || !entX || !entY) {
          alert("주소를 선택한 뒤 회원가입을 진행해주세요.");
          return;
      }

      if (!checkPasswordMatch()) {
          alert("비밀번호와 비밀번호 확인값을 확인해주세요.");
          return;
      }

      const request = {
          loginId: document.getElementById("loginId").value,
          password: document.getElementById("password").value,
          passwordConfirm: document.getElementById("passwordConfirm").value,
          nickname: document.getElementById("nickname").value,
          termsAgreed: document.getElementById("termsAgreed").checked,
          address: address,
          entX: Number(entX),
          entY: Number(entY)
      };

      const response = await fetch("/auth/signup", {
          method: "POST",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify(request)
      });

      const data = await response.json();
      renderResult(data);
  }
</script>
</body>
</html>
