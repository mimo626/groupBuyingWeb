<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 테스트</title>
</head>
<body>
<h1>로그인 테스트</h1>
<a href="/auth/signup-test">회원가입</a>

<div>
  <label for="loginId">로그인 아이디</label>
  <input type="text" id="loginId" placeholder="로그인 아이디 입력">
</div>

<div>
  <label for="password">비밀번호</label>
  <input type="password" id="password" placeholder="비밀번호 입력">
</div>

<button type="button" id="loginBtn">로그인 요청</button>

<h2>응답 결과</h2>
<pre id="result"></pre>

<script>
  const loginIdInput = document.getElementById("loginId");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const resultBox = document.getElementById("result");

  loginBtn.addEventListener("click", async () => {
    const loginId = loginIdInput.value;
    const password = passwordInput.value;

    try {
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "same-origin",
        body: JSON.stringify({
          loginId: loginId,
          password: password
        })
      });

      // 서버 응답 데이터를 JSON으로 파싱하여 화면에 출력
      const data = await response.json();
      resultBox.textContent = JSON.stringify(data, null, 2);

      // 로그인 성공 여부 확인 (HTTP 상태 코드 200번대)
      if (response.ok) {
        alert("로그인에 성공했습니다. 메인 화면으로 이동합니다.");
        // 메인 화면으로 이동 (서버의 라우팅 설정에 맞게 경로를 수정해 주세요. 예: /main)
        window.location.href = "/group-buying/list";
      } else {
        alert("로그인 실패: 아이디와 비밀번호를 다시 확인해주세요.");
      }

    } catch (error) {
      console.error("로그인 요청 중 오류 발생:", error);
      resultBox.textContent = "서버 통신 중 오류가 발생했습니다.\n" + error.message;
    }
  });
</script>
</body>
