<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 | 도토리 창고</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<main class="login-page">
  <section class="login-card">
    <div class="login-header">
      <div class="login-logo">🌰</div>
      <h1>로그인</h1>
      <p>
        동네 공동구매를 시작하려면<br>
        도토리 창고 계정으로 로그인해 주세요.
      </p>
    </div>

    <div class="form-group">
      <label for="loginId">아이디</label>
      <input type="text" id="loginId" placeholder="아이디 입력">
    </div>

    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호 입력">
    </div>

    <button type="button" id="loginBtn" class="login-btn">로그인</button>

    <div class="signup-area">
      아직 계정이 없나요?
      <a href="/auth/signup">회원가입</a>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon">✓</div>
    <h2 id="modalTitle">로그인 성공</h2>
    <p id="modalMessage">메인 화면으로 이동합니다.</p>

    <div class="modal-actions">
      <button type="button" class="modal-btn confirm" id="modalConfirmBtn">확인</button>
    </div>
  </div>
</div>

<script>
  const loginIdInput = document.getElementById("loginId");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");

  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalIcon = document.getElementById("modalIcon");
  const modalTitle = document.getElementById("modalTitle");
  const modalMessage = document.getElementById("modalMessage");
  const modalConfirmBtn = document.getElementById("modalConfirmBtn");

  let modalConfirmAction = null;

  function openModal(type, title, message, confirmAction) {
    modalIcon.className = "modal-icon " + type;
    modalIcon.textContent = type === "success" ? "✓" : "!";
    modalTitle.textContent = title;
    modalMessage.textContent = message;
    modalConfirmAction = confirmAction || null;
    modalBackdrop.classList.add("is-open");
  }

  function closeModal() {
    modalBackdrop.classList.remove("is-open");
    modalConfirmAction = null;
  }

  modalConfirmBtn.addEventListener("click", () => {
    if (modalConfirmAction) {
      modalConfirmAction();
      return;
    }

    closeModal();
  });

  modalBackdrop.addEventListener("click", (event) => {
    if (event.target === modalBackdrop) {
      closeModal();
    }
  });

  loginBtn.addEventListener("click", async () => {
    const loginId = loginIdInput.value.trim();
    const password = passwordInput.value.trim();

    if (!loginId || !password) {
      openModal(
        "fail",
        "입력값 확인",
        "아이디와 비밀번호를 모두 입력해 주세요."
      );
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "로그인 중...";

    try {
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "same-origin",
        body: JSON.stringify({
          loginId: loginId,
          password: password
        })
      });

      const data = await response.json();

      if (data.status == 200) {
        openModal(
          "success",
          "로그인 성공",
          "메인 화면으로 이동합니다.",
          () => {
            window.location.href = "/group-buyings";
          }
        );
      } else {
        openModal(
          "fail",
          "로그인 실패",
          "아이디와 비밀번호를 다시 확인해 주세요."
        );
      }

    } catch (error) {
      console.error("로그인 요청 중 오류 발생:", error);

      openModal(
        "fail",
        "서버 통신 오류",
        "서버와 통신하는 중 문제가 발생했습니다."
      );

    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "로그인";
    }
  });
</script>
</body>
</html>
